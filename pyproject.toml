[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-air-quality-planning"
version = "0.1.0"
description = "Cloud data pipeline for Chicago outdoor-event air-quality planning"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["PyYAML>=6,<7", "pg8000>=1.31,<2", "sqlparse>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
spark = ["pyspark==3.5.3"]
warehouse = ["snowflake-connector-python==5.2.0", "google-cloud-storage>=3.1,<4"]
cloudsql = ["cloud-sql-python-connector[pg8000]>=1.18,<2"]
gcp = ["google-cloud-storage>=2.18,<4"]
epa = [
  "google-cloud-storage>=3.1,<4",
  "cloud-sql-python-connector[pg8000]>=1.18,<2",
  "requests>=2.32,<3",
]
airnow = [
  "google-cloud-storage>=3.1,<4",
  "cloud-sql-python-connector[pg8000]>=1.18,<2",
  "requests>=2.32,<3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
