deployment_requirements:
- Build and pin a new Python 3.15 image containing the tested fixed-cohort poller.
- Apply the prepared Terraform configuration with the existing scheduler paused;
  use the same scheduler resource, never a parallel second schedule.
- Manually execute one preflight cycle, verify exact IDs, client QC, committed database
  writes, raw bytes and settled point consumption before enabling the schedule.
- Set a future activation time after preflight; recompute available collection days
  and the 72-hour review window without extending the final cutoff.
- Run analysis.collection_gate after the first 72 complete UTC hours and daily
  for completed 24-hour windows; investigate a nonzero exit status.
- Pause both schedulers at the end and record the final data/points audit.
study_scope:
  objective: Reliable longitudinal comparisons near eligible reference sites, with
    secondary redundancy; no balanced seven-county representation claim.
  selection_decision: Keep the reviewed 20 IDs; do not relax the 95% historical QC
    or 10 km distance limits merely to add reference-site names.
  historical_evidence_days: 3
  forecast_guarantee: false
  coverage_audit_file: output/collection_review/coverage_gaps.json
  primary_pair_distance_km_max: 5
  exploratory_pair_distance_km_max: 10
  exploratory_sensor_ids:
